version: '3.8'

services:
  gabi_upload:
    build: .
    container_name: gabi_blind_upload
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8050}:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-for-gabi-50}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Gabi50!}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-52428800}
      - DATA_DIR=/app/data
    volumes:
      - ./uploads_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/stats')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
