<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Gabis 50er</title>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
    <div class="checkerboard-top"></div>
    <div class="admin-login-card">
        <div class="diner-badge">🔐 VERANSTALTER-LOGIN</div>
        <h2>Gabis 50er</h2>
        <p>Passwort eingeben, um alle Party-Fotos einzusehen und herunterzuladen.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin') }}" class="admin-form">
            <div class="form-group">
                <label for="password">Admin Passwort</label>
                <input type="password" id="password" name="password" required autofocus placeholder="Passwort eingeben...">
            </div>
            <button type="submit" class="btn btn-retro btn-block">Anmelden</button>
        </form>
        
        <div class="login-footer">
            <a href="{{ url_for('index') }}">← Zurück zur Hauptseite</a>
        </div>
    </div>
</body>
</html>
